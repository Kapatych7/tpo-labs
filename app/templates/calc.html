{% extends "base.html" %}
{% block title %}Калькулятор{% endblock %}
{% block head %}
<style>
.calc { width: 320px; margin: 10px auto; background: #1e2633; padding: 16px; border-radius: 14px; }
.calc .history { color: #8fa0bb; min-height: 20px; text-align: right; font-size: 14px; }
.calc .display { background: #0f141c; color: #fff; font-size: 34px; text-align: right; padding: 10px 12px; border-radius: 8px; min-height: 58px; overflow: hidden; white-space: nowrap; }
.calc .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.calc button { font-size: 20px; padding: 14px 0; background: #36435a; border-radius: 8px; }
.calc button.op { background: #e58a1f; }
.calc button.fn { background: #5b6880; }
.calc button.eq { background: #2d6cdf; }
.calc button.zero { grid-column: span 2; }
</style>
{% endblock %}
{% block content %}
<h1>Калькулятор</h1>
<div class="calc" id="calculator">
  <div class="history" id="history"></div>
  <div class="display" id="display">0</div>
  <div class="keys">
    <button class="fn" id="btn-clear" data-action="clear">C</button>
    <button class="fn" id="btn-ce" data-action="ce">CE</button>
    <button class="fn" id="btn-back" data-action="back">⌫</button>
    <button class="op" id="btn-div" data-op="/">÷</button>
    <button id="btn-7" data-digit="7">7</button>
    <button id="btn-8" data-digit="8">8</button>
    <button id="btn-9" data-digit="9">9</button>
    <button class="op" id="btn-mul" data-op="*">×</button>
    <button id="btn-4" data-digit="4">4</button>
    <button id="btn-5" data-digit="5">5</button>
    <button id="btn-6" data-digit="6">6</button>
    <button class="op" id="btn-sub" data-op="-">−</button>
    <button id="btn-1" data-digit="1">1</button>
    <button id="btn-2" data-digit="2">2</button>
    <button id="btn-3" data-digit="3">3</button>
    <button class="op" id="btn-add" data-op="+">+</button>
    <button class="fn" id="btn-sign" data-action="sign">±</button>
    <button id="btn-0" data-digit="0">0</button>
    <button id="btn-dot" data-action="dot">,</button>
    <button class="eq" id="btn-eq" data-action="eq">=</button>
  </div>
</div>
<p class="muted">Клавиатура: цифры, + - * /, Enter (=), Esc (C), Backspace (⌫), точка или запятая.</p>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='calc.js') }}"></script>
{% endblock %}
