{% extends "base.html" %}
{% block title %}Список задач{% endblock %}
{% block head %}
<style>
.todo-add { display: flex; gap: 8px; }
.todo-add input { flex: 1; }
.todo-list { list-style: none; padding: 0; margin: 18px 0; }
.todo-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #e1e6ee; border-radius: 8px; margin-bottom: 8px; width: 100%; }
.todo-item .text { flex: 1; white-space: nowrap; }
.todo-item.done .text { text-decoration: line-through; color: #8a93a5; }
.todo-item .del { background: #d9534f; padding: 4px 10px; font-size: 14px; }
.todo-item .edit-input { flex: 1; }
.filters { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.filters button { background: #e8edf5; color: #1d2433; padding: 6px 12px; font-size: 14px; }
.filters button.active { background: #2d6cdf; color: #fff; }
.filters .spacer { flex: 1; }
</style>
{% endblock %}
{% block content %}
<h1>Список задач</h1>
<div class="todo-add">
  <input type="text" id="new-task" placeholder="Что нужно сделать?" autocomplete="off">
  <button id="add-btn">Добавить</button>
</div>
<ul class="todo-list" id="todo-list"></ul>
<div class="filters">
  <span id="counter" class="muted">Осталось задач: 0</span>
  <span class="spacer"></span>
  <button data-filter="all" class="active" id="filter-all">Все</button>
  <button data-filter="active" id="filter-active">Активные</button>
  <button data-filter="done" id="filter-done">Выполненные</button>
  <button id="clear-done" style="background:#fbe3e2;color:#a01b22">Очистить выполненные</button>
</div>
<p class="muted">Двойной щелчок по задаче — редактирование. Задачи сохраняются в браузере.</p>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='todo.js') }}"></script>
{% endblock %}
