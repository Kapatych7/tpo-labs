# ЛР9: автоматический запуск автотестов при каждом push и pull request
name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest            # операционная система виртуальной машины
    timeout-minutes: 15

    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v4

      - name: Установить Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Версии окружения
        run: |
          python --version
          google-chrome --version
          pip list | grep -Ei "selenium|pytest|requests|flask|webdriver"

      - name: Модульные тесты (ЛР6)
        run: pytest lab6 --junitxml=reports/unit.xml

      - name: Тесты REST API (ЛР5)
        run: pytest lab5 --junitxml=reports/api.xml

      - name: UI-тесты Selenium (ЛР3, ЛР4)
        env:
          HEADLESS: "1"
        run: pytest lab3 lab4 --junitxml=reports/ui.xml

      - name: Сохранить отчёты и скриншоты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            screenshots/
